name: CI Validation

on:
  push:
    branches:
      - '**' # Executa em todas as branches
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate (Lint + Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Types
        run: npx prisma generate

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      # Tier 1 — Runtime (production) dependencies: zero tolerance, no allowlist.
      - name: Audit Production Dependencies (strict)
        run: npm audit --omit=dev --audit-level=high

      # Tier 2 — Full tree (incl. devDependencies) with a reviewed, documented
      # allowlist (audit-ci.jsonc). Any NEW high/critical advisory fails the build.
      - name: Audit Full Dependency Tree (audit-ci allowlist)
        run: npm run audit:ci

  infrastructure-config:
    name: Infrastructure Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

  build-verification:
    name: Production Build Verification
    needs: [quality-gate, security-audit, infrastructure-config]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Production Build Test
        run: npm run build
